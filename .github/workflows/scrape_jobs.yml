
name: 🔄 Automação Diária de Coleta de Vagas e Release

on:
  schedule:
    - cron: '15 23 * * *' # Executa diariamente às 23:00 UTC
  workflow_dispatch:     # Permite execução manual pelo painel do GitHub

permissions:
  contents: write        # Obrigatório para gravar commits e criar releases

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas tabulate

      - name: 🚀 Executar Script de Coleta (main.py)
        run: python main.py

      - name: 💾 Commit e Push Automático das Alterações
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add main.py jobs.md README.md
          
          # Verifica se há alterações para commitar
          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "Nenhuma alteração nova detectada."
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            git commit -m "🤖 Atualização automática de vagas e README.md ($(date +'%Y-%m-%d'))"
            git push
          fi

      - name: 📅 Obter Data Atual
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 🏷️ Criar Release Automática no GitHub
        if: steps.commit.outputs.changes_detected == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.TODAY }}
          name: 📋 Relatório de Vagas - ${{ steps.date.outputs.TODAY }}
          body: |
            🤖 **Coleta automatizada realizada com sucesso!**
            
            As novas oportunidades de engenharia de software foram extraídas, apendadas no arquivo `jobs.md` e sincronizadas no `README.md`.
          files: |
            jobs.md
          files: |
            jobs.md
        env:
          TODAY: ${{ github.event.repository.updated_at || 'date +%Y-%m-%d' }} # Fallback ou data atual
